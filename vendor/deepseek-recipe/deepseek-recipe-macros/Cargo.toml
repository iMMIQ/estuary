[package]
name = "deepseek-recipe-macros"
version = "0.2.0"
edition = "2024"
readme = "../README.md"
license = "MIT"
repository = "https://github.com/deepseek-ai/deepseek-recipe"
description = "Procedural macros for deepseek-recipe: the `prompt!` template macro and the `UntaggedDeserialize` derive."
documentation = "https://docs.rs/deepseek-recipe-macros"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
