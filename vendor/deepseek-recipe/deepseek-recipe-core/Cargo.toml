[package]
name = "deepseek-recipe-core"
version = "0.2.0"
edition = "2024"
readme = "../README.md"
license = "MIT"
repository = "https://github.com/deepseek-ai/deepseek-recipe"
description = "Shared conversation, message, and tool types for DeepSeek models."
documentation = "https://docs.rs/deepseek-recipe-core"

[dependencies]
deepseek-recipe-macros = { version = "0.2.0", path = "../deepseek-recipe-macros" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
