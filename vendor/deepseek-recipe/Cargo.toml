[workspace]
members = ["deepseek-recipe", "deepseek-recipe-core"]
resolver = "3"

[workspace.package]
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/deepseek-ai/deepseek-recipe"

[workspace.dependencies]
async-stream = "0.3.6"
base64 = "0.23.1"
deepseek-recipe-core = { version = "0.1.0", path = "deepseek-recipe-core" }
itertools = "0.15.0"
jsonschema = { version = "0.60.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
strum_macros = "0.28.0"
tokenizers = { version = "0.23.2", features = ["http"] }
tokio-stream = "0.1.19"
