[workspace]
members = ["deepseek-recipe", "deepseek-recipe-core", "deepseek-recipe-macros"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/deepseek-ai/deepseek-recipe"

[workspace.dependencies]
base64 = "0.23.1"
data-url = "0.3.2"
deepseek-recipe-core = { version = "0.2.0", path = "deepseek-recipe-core" }
deepseek-recipe-macros = { version = "0.2.0", path = "deepseek-recipe-macros" }
indexmap = { version = "2.14.1", features = ["serde"] }
itertools = "0.15.0"
jsonschema = { version = "0.60.2", default-features = false }
proc-macro2 = "1.0.106"
quote = "1.0.45"
rand = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
strum_macros = "0.28.0"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
