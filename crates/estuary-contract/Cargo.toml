[package]
name = "estuary-contract"
version = "0.5.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"], optional = true }

[features]
config-contract = ["dep:ts-rs"]

[[example]]
name = "config_contract"
required-features = ["config-contract"]

[lints]
workspace = true
