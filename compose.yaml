services:
  estuary:
    build:
      context: .
      args:
        RUST_VERSION: "1.97.1"
        IMAGE_REGISTRY: "${IMAGE_REGISTRY:-docker.m.daocloud.io}"
    image: estuary:local
    init: true
    restart: unless-stopped
    environment:
      ESTUARY_DATABASE: /var/lib/estuary/estuary.db
      ESTUARY_LISTEN: 0.0.0.0:8080
      ESTUARY_ADMIN_LISTEN: 0.0.0.0:9090
      ESTUARY_LOG_JSON: "true"
      RUST_LOG: "${RUST_LOG:-estuary=info}"
    volumes:
      - estuary-data:/var/lib/estuary
    ports:
      - "127.0.0.1:${ESTUARY_PORT:-8080}:8080"
      - "127.0.0.1:${ESTUARY_ADMIN_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  estuary-data:
