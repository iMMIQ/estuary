[package]
name = "estuary"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A prefix-aware, load-sensitive gateway for OpenAI-compatible LLM APIs"
license = "Apache-2.0"
repository = "https://github.com/iMMIQ/estuary"
readme = "README.md"
keywords = ["llm", "openai", "gateway", "load-balancing", "prefix-cache"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8.9", features = ["http2", "json", "macros"] }
blake3 = "1.8"
bytes = "1.10"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
http = "1.3"
mime_guess = "2.0"
parking_lot = "0.12"
prometheus-client = "0.25"
prometheus-parse = "0.2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rmpv = "1.3"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8.7"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.24", features = ["v7"] }
zeromq = { version = "0.6", default-features = false, features = ["tcp-transport", "tokio-runtime"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
