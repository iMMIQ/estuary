global
    log stdout format raw local0
    stats socket /run/estuary/haproxy.sock mode 660 level admin
    maxconn 10000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 65m
    timeout server 65m
    timeout tunnel 65m
    timeout queue 65m

frontend estuary_public
    bind 0.0.0.0:8080
    default_backend estuary_public

backend estuary_public
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    server slot-a 127.0.0.1:18081 check port 19091 inter 1s rise 2 fall 2
    server slot-b 127.0.0.1:18082 check port 19092 inter 1s rise 2 fall 2

frontend estuary_admin
    bind 127.0.0.1:9090
    default_backend estuary_admin

backend estuary_admin
    balance first
    option httpchk GET /health/live
    http-check expect status 200
    server slot-a 127.0.0.1:19091 check inter 1s rise 1 fall 2
    server slot-b 127.0.0.1:19092 check inter 1s rise 1 fall 2
