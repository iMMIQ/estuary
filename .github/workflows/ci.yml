name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    name: Rust (1.98.1 musl ${{ matrix.arch }})
    needs: checks
    env:
      RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            cpu: x86-64
          - arch: arm64
            target: aarch64-unknown-linux-musl
            cpu: generic
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use official Cargo registry
        run: sed -i '/^\[source\./,$d' .cargo/config.toml
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Resolve Rust toolchain
        id: rust
        shell: bash
        run: |
          echo "release=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sysroot=$(rustc --print sysroot)" >> "$GITHUB_OUTPUT"
      - name: Cache musl standard library
        id: rust-std-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.rust.outputs.sysroot }}/lib/rustlib/${{ matrix.target }}
          key: rust-std-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ matrix.target }}
      - name: Install musl target from official Rust distribution
        if: steps.rust-std-cache.outputs.cache-hit != 'true'
        run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2.2.1
      - uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-zigbuild@0.24.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo zigbuild --locked --release --target ${{ matrix.target }}
