name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use official Cargo registry
        run: rm .cargo/config.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Use official npm registry
        run: sed -i 's|https://repo.huaweicloud.com/repository/npm/|https://registry.npmjs.org/|g' bun.lock
      - run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build

  release:
    name: Rust (stable musl ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Use official Cargo registry
        run: rm .cargo/config.toml
      - name: Resolve Rust toolchain
        id: rust
        shell: bash
        run: |
          echo "release=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sysroot=$(rustc --print sysroot)" >> "$GITHUB_OUTPUT"
      - name: Cache musl standard library
        id: rust-std-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.rust.outputs.sysroot }}/lib/rustlib/${{ matrix.target }}
          key: rust-std-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ matrix.target }}
      - name: Install musl target from official Rust distribution
        if: steps.rust-std-cache.outputs.cache-hit != 'true'
        run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo zigbuild --locked --release --target ${{ matrix.target }}
