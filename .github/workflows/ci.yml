name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use official Cargo registry
        run: rm .cargo/config.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --test load_balance_stress -- --ignored
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Use official npm registry
        run: sed -i 's|https://repo.huaweicloud.com/repository/npm/|https://registry.npmjs.org/|g' bun.lock
      - run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: bun run check
      - run: bun run deadcode
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run test:e2e

  scripts:
    name: Python and deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install script checks
        run: |
          python3 -m venv "$RUNNER_TEMP/quality-tools"
          "$RUNNER_TEMP/quality-tools/bin/python" -m pip install \
            ruff==0.16.10 shellcheck-py==0.11.0.1 shfmt-py==4.2.0 actionlint-py==1.7.12.25
          echo "$RUNNER_TEMP/quality-tools/bin" >> "$GITHUB_PATH"
      - run: ruff check tests
      - run: ruff format --check tests
      - run: python3 tests/deepseek_e2e.py --help
      - run: actionlint
      - run: shellcheck deploy/*.sh
      - run: shfmt -d -i 4 -ci deploy/*.sh
      - run: for script in deploy/*.sh; do bash -n "$script"; done

  release:
    name: Rust (1.99 musl ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use official Cargo registry
        run: rm .cargo/config.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: Resolve Rust toolchain
        id: rust
        shell: bash
        run: |
          echo "release=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sysroot=$(rustc --print sysroot)" >> "$GITHUB_OUTPUT"
      - name: Cache musl standard library
        id: rust-std-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.rust.outputs.sysroot }}/lib/rustlib/${{ matrix.target }}
          key: rust-std-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ matrix.target }}
      - name: Install musl target from official Rust distribution
        if: steps.rust-std-cache.outputs.cache-hit != 'true'
        run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo zigbuild --locked --release --target ${{ matrix.target }}
