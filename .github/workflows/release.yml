name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Match tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          web_version="$(jq -r .version web/package.json)"

          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Tag version $tag_version does not match Cargo version $cargo_version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$web_version" ]]; then
            echo "Tag version $tag_version does not match Web version $web_version" >&2
            exit 1
          fi

  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml

  binary:
    env:
      RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }}"
    name: Build ${{ matrix.arch }} binary
    needs: [validate, checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            cpu: x86-64
          - arch: arm64
            target: aarch64-unknown-linux-musl
            cpu: generic
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use official Cargo registry
        run: sed -i '/^\[source\./,$d' .cargo/config.toml
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Resolve Rust toolchain
        id: rust
        shell: bash
        run: |
          echo "release=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sysroot=$(rustc --print sysroot)" >> "$GITHUB_OUTPUT"
      - name: Cache musl standard library
        id: rust-std-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.rust.outputs.sysroot }}/lib/rustlib/${{ matrix.target }}
          key: rust-std-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ matrix.target }}
      - name: Install musl target from official Rust distribution
        if: steps.rust-std-cache.outputs.cache-hit != 'true'
        run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2.2.1
      - uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-zigbuild@0.24.1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
      - name: Cross-compile static binary
        run: cargo zigbuild --locked --profile dist --target ${{ matrix.target }}
      - name: Package binary deployment
        shell: bash
        run: |
          set -euo pipefail
          package="estuary-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          install -D -m 0755 target/${{ matrix.target }}/dist/estuary "release/${package}/estuary"
          cp -a deploy "release/${package}/deploy"
          tar -C release -czf "release/${package}.tar.gz" "${package}"
          (cd release && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: estuary-release-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: estuary-release-*
          path: release
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256
          body: |
            Static Linux binaries are attached for `amd64` and `arm64`.

            ```console
            sha256sum --check estuary-${{ github.ref_name }}-linux-amd64.tar.gz.sha256
            tar -xzf estuary-${{ github.ref_name }}-linux-amd64.tar.gz
            ```
