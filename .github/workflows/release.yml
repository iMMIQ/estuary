name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          web_version="$(jq -r .version web/package.json)"

          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Tag version $tag_version does not match Cargo version $cargo_version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$web_version" ]]; then
            echo "Tag version $tag_version does not match Web version $web_version" >&2
            exit 1
          fi

  web:
    name: Build web assets
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Use official npm registry
        run: sed -i 's|https://repo.huaweicloud.com/repository/npm/|https://registry.npmjs.org/|g' bun.lock
      - run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  verify:
    name: Verify Rust
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use official Cargo registry
        run: rm .cargo/config.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-verify
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets

  binary:
    name: Build ${{ matrix.arch }} binary
    needs: [web, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Use official Cargo registry
        run: rm .cargo/config.toml
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Resolve Rust toolchain
        id: rust
        shell: bash
        run: |
          echo "release=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sysroot=$(rustc --print sysroot)" >> "$GITHUB_OUTPUT"
      - name: Cache musl standard library
        id: rust-std-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.rust.outputs.sysroot }}/lib/rustlib/${{ matrix.target }}
          key: rust-std-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ matrix.target }}
      - name: Install musl target from official Rust distribution
        if: steps.rust-std-cache.outputs.cache-hit != 'true'
        run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Cross-compile static binary
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: Package binary deployment
        shell: bash
        run: |
          set -euo pipefail
          package="estuary-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          install -D -m 0755 target/${{ matrix.target }}/release/estuary "release/${package}/estuary"
          cp -a deploy "release/${package}/deploy"
          tar -C release -czf "release/${package}.tar.gz" "${package}"
          (cd release && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: estuary-release-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: estuary-release-*
          path: release
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256
          body: |
            Static Linux binaries and zero-downtime systemd/HAProxy deployment assets are attached for `amd64` and `arm64`.

            ```console
            sha256sum --check estuary-${{ github.ref_name }}-linux-amd64.tar.gz.sha256
            tar -xzf estuary-${{ github.ref_name }}-linux-amd64.tar.gz
            ```
