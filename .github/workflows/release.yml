name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always
  RUSTUP_DIST_SERVER: https://mirrors.ustc.edu.cn/rust-static
  RUSTUP_UPDATE_ROOT: https://mirrors.ustc.edu.cn/rust-static/rustup

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          web_version="$(jq -r .version web/package.json)"

          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Tag version $tag_version does not match Cargo version $cargo_version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$web_version" ]]; then
            echo "Tag version $tag_version does not match Web version $web_version" >&2
            exit 1
          fi

  web:
    name: Build web assets
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  binary:
    name: Build ${{ matrix.arch }} binary
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Resolve Rust toolchain
        id: rust
        shell: bash
        run: |
          echo "release=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sysroot=$(rustc --print sysroot)" >> "$GITHUB_OUTPUT"
      - name: Cache musl standard library
        uses: actions/cache@v6
        with:
          path: ${{ steps.rust.outputs.sysroot }}/lib/rustlib/${{ matrix.target }}
          key: rust-std-${{ runner.os }}-${{ steps.rust.outputs.release }}-${{ matrix.target }}
      - name: Install musl target from USTC
        run: .github/scripts/install-rust-target.sh ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Cross-compile static binary
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: Stage container binary
        run: |
          install -D -m 0755 \
            target/${{ matrix.target }}/release/estuary \
            docker-bin/linux/${{ matrix.arch }}/estuary
      - uses: actions/upload-artifact@v7
        with:
          name: estuary-linux-${{ matrix.arch }}
          path: docker-bin
          if-no-files-found: error

  image:
    name: Publish container
    needs: [validate, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: estuary-linux-*
          path: docker-bin
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Estuary
            org.opencontainers.image.description=Prefix-aware, load-sensitive gateway for OpenAI-compatible LLM APIs
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Container image:

            ```console
            docker pull ghcr.io/${{ needs.image.outputs.image_name }}:${{ github.ref_name }}
            ```

            Multi-platform manifest: `linux/amd64`, `linux/arm64`

            Digest: `${{ needs.image.outputs.digest }}`
