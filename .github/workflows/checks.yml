name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use official Cargo registry
        run: sed -i '/^\[source\./,$d' ../.cargo/config.toml
      - name: Install LLD
        run: sudo apt-get update && sudo apt-get install -y lld
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: config-contract
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Use official npm registry
        run: sed -i 's|https://repo.huaweicloud.com/repository/npm/|https://registry.npmjs.org/|g' bun.lock
      - run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: bun run contract:check
      - run: bun run check
      - run: bun run deadcode
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  rust:
    name: Rust (1.98.1)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use official Cargo registry
        run: sed -i '/^\[source\./,$d' .cargo/config.toml
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Install LLD
        run: sudo apt-get update && sudo apt-get install -y lld
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --test load_balance_stress -- --ignored
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  scripts:
    name: Python and deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install script checks
        run: |
          python3 -m venv "$RUNNER_TEMP/quality-tools"
          "$RUNNER_TEMP/quality-tools/bin/python" -m pip install \
            ruff==0.17.3 shellcheck-py==0.11.0.1 shfmt-py==4.2.0 actionlint-py==1.7.12.25
          echo "$RUNNER_TEMP/quality-tools/bin" >> "$GITHUB_PATH"
      - run: ruff check tests
      - run: ruff format --check tests
      - name: Check coding-agent test entry points
        run: |
          for script in tests/*_e2e.py; do
            python3 "$script" --help
          done
      - run: actionlint
      - run: shellcheck deploy/*.sh
      - run: shfmt -d -i 4 -ci deploy/*.sh
      - run: for script in deploy/*.sh; do bash -n "$script"; done
